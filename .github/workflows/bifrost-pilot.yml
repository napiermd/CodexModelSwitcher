name: Bifrost native contract
on:
  pull_request:
    paths:
      - 'experiments/bifrost/**'
      - 'Tests/test_bifrost_pilot.py'
      - '.github/workflows/bifrost-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bifrost-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-azure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REPORT_PATH: ${{ runner.temp }}/bifrost-native-contract.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Pull exact transport and synthetic helper images
        run: |
          python3 - <<'PY'
          import json, platform, subprocess
          from pathlib import Path
          pin = json.loads(Path('experiments/bifrost/pin.json').read_text())
          arch = {'x86_64': 'amd64', 'aarch64': 'arm64'}[platform.machine()]
          for image in (pin['images'][arch], pin['mock_image']):
              subprocess.run(['docker', 'pull', image], check=True, timeout=180)
          PY
      - name: Exercise native Azure passthrough with zero gateway retries
        run: python3 -B experiments/bifrost/pilot.py --surface azure-passthrough --output "$REPORT_PATH"
      - name: Require complete conformance evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT_PATH']).read_text())
          failures = {row['case']: [name for name, passed in row.get('checks', {}).items() if not passed]
                      for row in report['cases'] if not row['passed']}
          print(json.dumps({'image': report['image'], 'surface': report['surface'],
                            'cases': len(report['cases']), 'failures': failures,
                            'all_synthetic_gates_passed': report['all_synthetic_gates_passed'],
                            'cleanup_errors': report['cleanup_errors']}, indent=2))
          assert report['all_synthetic_gates_passed'], 'Native transport conformance failed; see report'
          assert not report['cleanup_errors'], 'Pilot cleanup was not verified'
          PY
      - name: Retain synthetic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bifrost-native-contract
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 14
